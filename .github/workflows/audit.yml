name: Site audit
on:
  push:
    branches: [main]
    paths: ['index.html','data.json','places.tsv','tests/**']
  schedule:
    - cron: '45 23 * * *'   # 7:45am Kuala Lumpur, after the 7am update
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tests/audit.js
